<style>
/* Layout: one full-height card per question, vertical snap scroll like a short-video feed; slim sticky header with filters and score */
/* Deliberately one look: near-black navy with bright coral orange (Java) and hot pink (math) */
:root {
  --bg: #050914;
  --surface: #0c1222;
  --ink: #eef1f8;
  --muted: #8d97b0;
  --line: #1b2440;
  --java: #FA9247;
  --math: #E94C96;
  --good: #4fd18b;
  --good-bg: #0e2a1e;
  --bad: #ff6b6b;
  --bad-bg: #2e1219;
  --code-bg: #080e1c;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5;
  display: flex; flex-direction: column; overflow: hidden;
}
header {
  flex: none; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 8px; display: grid; gap: 8px;
}
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.25rem; letter-spacing: -0.01em; }
.countdown { color: var(--muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
.countdown b { color: var(--ink); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab {
  font: 700 0.85rem var(--body); border: 1px solid var(--line); background: transparent; color: var(--ink);
  padding: 5px 12px; border-radius: 999px; cursor: pointer;
}
.tab[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tab:focus-visible, .opt:focus-visible, .btn:focus-visible { outline: 3px solid var(--math); outline-offset: 2px; }
.stats { display: flex; gap: 14px; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); }
.progress { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress span { display: block; height: 100%; width: 0; background: var(--ink); transition: width .3s; }

#feed { flex: 1; min-height: 0; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; }
.card {
  min-height: 100%; scroll-snap-align: start; display: flex; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}
.card.java { --accent: var(--java); }
.card.math { --accent: var(--math); }
.inner { width: 100%; max-width: 560px; display: grid; gap: 16px; min-width: 0; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.subj { color: var(--accent); font-weight: 700; }
.q { font-family: var(--display); font-weight: 600; font-size: clamp(1.3rem, 4.6vw, 1.7rem); line-height: 1.25; text-wrap: balance; margin: 0; }
pre {
  margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
  font: 0.92rem/1.55 var(--mono); overflow-x: auto; color: var(--ink);
}
code { font-family: var(--mono); font-size: 0.9em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: center; text-align: left; width: 100%;
  font: 1rem var(--body); color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer;
  transition: border-color .15s, transform .1s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:active:not(:disabled) { transform: scale(0.99); }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font: 600 0.8rem var(--mono); background: var(--code-bg); color: var(--muted); }
.opt .t { min-width: 0; overflow-wrap: anywhere; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.right .k { background: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .k { background: var(--bad); color: var(--surface); }
.opt.dim { opacity: 0.55; }
.fb { display: grid; gap: 12px; }
.fb p { margin: 0; }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--good); }
.verdict.no { color: var(--bad); }
.btn {
  justify-self: start; font: 700 0.95rem var(--body); border: none; border-radius: 999px; padding: 10px 20px;
  background: var(--accent, var(--ink)); color: var(--surface); cursor: pointer;
}
.hint { color: var(--muted); font-size: 0.8rem; text-align: center; }
.end .q { font-size: clamp(1.6rem, 6vw, 2.2rem); }
.big { font-family: var(--display); font-weight: 800; font-size: 3.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.amp { background: linear-gradient(135deg, var(--java), var(--math)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.java { --accent: var(--java); }
.math { --accent: var(--math); }
.nav { display: flex; gap: 4px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.navbtn { font: 700 0.9rem var(--body); border: none; background: transparent; color: var(--muted); padding: 6px 16px; border-radius: 999px; cursor: pointer; }
.navbtn[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.navbtn:focus-visible, .item:focus-visible, .lead:focus-visible, .back:focus-visible, .chip:focus-visible { outline: 3px solid var(--math); outline-offset: 2px; }
.chip { font: 700 0.8rem var(--body); border: 1px solid var(--ink); background: var(--ink); color: var(--surface); padding: 5px 12px; border-radius: 999px; cursor: pointer; }

#read { flex: 1; min-height: 0; overflow-y: auto; }
.wrap {
  max-width: 1040px; margin: 0 auto; display: grid; gap: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 72px;
}
.mast { display: grid; gap: 6px; }
.mast h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.2rem, 7vw, 3.4rem); letter-spacing: -0.025em; line-height: 1; margin: 0; }
.mast p { margin: 0; color: var(--muted); max-width: 60ch; }
.kicker { font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: var(--accent); }
.headline { font-family: var(--display); font-weight: 800; line-height: 1.15; letter-spacing: -0.01em; margin: 0; text-wrap: balance; color: var(--ink); }
.ingress { margin: 0; color: var(--muted); }
.rt { font-size: 0.8rem; color: var(--muted); }
.visual {
  background: var(--accent); color: var(--surface); font-family: var(--mono); font-weight: 600;
  display: grid; place-items: center; text-align: center; padding: 24px; min-height: 220px;
  font-size: clamp(1.5rem, 4.5vw, 2.4rem); letter-spacing: -0.02em; overflow-wrap: anywhere;
}
.visual.sm { min-height: 76px; font-size: 0.78rem; padding: 8px; border-radius: 8px; letter-spacing: 0; }
.lead {
  display: grid; grid-template-columns: 1.15fr 1fr; text-align: left; width: 100%; padding: 0; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; font: inherit; color: inherit;
}
.lead .txt { padding: 26px; display: grid; gap: 10px; align-content: center; min-width: 0; }
.lead .headline { font-size: clamp(1.6rem, 3.8vw, 2.3rem); }
.lead:hover .headline, .item:hover .headline { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
.col { display: grid; align-content: start; min-width: 0; }
.col h2 { font-family: var(--display); font-weight: 800; font-size: 1.15rem; margin: 0; padding-bottom: 8px; border-bottom: 3px solid var(--ink); }
.item {
  display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: start; text-align: left; width: 100%;
  padding: 16px 0; background: none; border: none; border-bottom: 1px solid var(--line); cursor: pointer; font: inherit; color: inherit;
}
.item .txt { display: grid; gap: 4px; min-width: 0; }
.item .headline { font-size: 1.15rem; }
.item .ingress { font-size: 0.92rem; }
@media (max-width: 720px) { .lead, .cols { grid-template-columns: 1fr; } .lead .visual { min-height: 150px; } }

.article { max-width: 680px; width: 100%; margin: 0 auto; display: grid; gap: 18px; min-width: 0; }
.back { justify-self: start; font: 700 0.9rem var(--body); color: var(--muted); background: none; border: none; padding: 0; cursor: pointer; }
.back:hover { color: var(--ink); }
.article h1.headline { font-size: clamp(1.9rem, 5.5vw, 2.7rem); }
.article .ingress { font-size: 1.2rem; font-weight: 700; color: var(--ink); line-height: 1.45; }
.article .visual { border-radius: 14px; min-height: 170px; }
.body { display: grid; gap: 16px; font-size: 1.07rem; line-height: 1.68; min-width: 0; }
.body h3 { font-family: var(--display); font-weight: 800; font-size: 1.35rem; line-height: 1.25; margin: 14px 0 0; text-wrap: balance; }
.body p, .body ul, .body ol { margin: 0; }
.body ul, .body ol { padding-left: 1.3em; display: grid; gap: 6px; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); }
.tbl tr:last-child td { border-bottom: none; }
.tbl th { background: var(--code-bg); font-weight: 700; }
.tip { background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; }
.tip .lbl { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: var(--accent); }
.cta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 18px; border: 1.5px solid var(--accent); border-radius: 14px; }
.cta p { margin: 0; flex: 1 1 220px; }
.more h2 { font-family: var(--display); font-weight: 800; font-size: 1.15rem; margin: 12px 0 0; padding-bottom: 8px; border-bottom: 3px solid var(--ink); }
.top { align-items: center; }
.brand { margin-right: auto; }
#today, #swipe { flex: 1; min-height: 0; overflow-y: auto; }
.focusbtn { font: 700 0.85rem var(--body); background: transparent; color: var(--ink); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.focusbtn:hover { border-color: var(--math); }
.focuspill { display: none; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; color: var(--muted); }
.focuspill b { font-family: var(--display); font-weight: 800; font-size: 1.25rem; color: var(--ink); }
body.focus .focuspill { display: flex; }
body.focus .nav, body.focus .focusbtn, body.focus .tabs { display: none; }
.ghost { font: 700 0.9rem var(--body); background: transparent; color: var(--ink); border: 1.5px solid var(--line); border-radius: 999px; padding: 9px 16px; cursor: pointer; }
.ghost.sm { font-size: 0.8rem; padding: 5px 12px; }
.ghost:hover:not(:disabled) { border-color: var(--accent, var(--math)); }
.ghost:disabled { opacity: 0.35; cursor: default; }
.ghost:focus-visible, .focusbtn:focus-visible, .bigstart:focus-visible, .short:focus-visible, .bl:focus-visible, a.btn:focus-visible { outline: 3px solid var(--math); outline-offset: 2px; }
a.btn { display: inline-block; text-decoration: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.xpbar { display: block; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; flex: 1; min-width: 60px; }
.xpbar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--java), var(--math)); transition: width .4s; }
.xpbar.mini { flex: none; width: 64px; height: 6px; align-self: center; }

/* code tracer */
.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 0; font: 0.9rem/1.55 var(--mono); overflow-x: auto; }
.ln { display: flex; gap: 12px; padding: 1px 14px; white-space: pre; transition: background .15s; min-width: max-content; }
.ln .no, .bl .no { color: var(--muted); width: 1.6em; text-align: right; flex: none; user-select: none; }
.ln.on { background: color-mix(in srgb, var(--accent) 24%, transparent); box-shadow: inset 3px 0 0 var(--accent); }
.vars { display: flex; flex-wrap: wrap; gap: 8px; min-height: 32px; }
.var { font: 0.85rem var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; }
.var b { color: var(--accent); font-weight: 600; }
.out { font: 0.9rem var(--mono); color: var(--muted); }
.out b { color: var(--ink); }
.note { margin: 0; min-height: 3em; }
.ctrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.count { color: var(--muted); font-size: 0.85rem; margin-left: auto; font-variant-numeric: tabular-nums; }
.tt td.hid { color: var(--muted); }
.tt tr.on td { background: color-mix(in srgb, var(--accent) 20%, transparent); }
.tt .hl { color: var(--accent); font-weight: 700; }

/* finn feilen */
.bugcode { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 0; overflow-x: auto; display: grid; }
.bl { display: flex; gap: 12px; width: 100%; min-width: max-content; text-align: left; background: none; border: none; color: var(--ink); font: 0.9rem/1.55 var(--mono); padding: 3px 14px; cursor: pointer; white-space: pre; }
.bl:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.bl:disabled { cursor: default; }
.bl.right { background: var(--good-bg); box-shadow: inset 3px 0 0 var(--good); }
.bl.wrong { background: var(--bad-bg); box-shadow: inset 3px 0 0 var(--bad); }

/* video */
.play { aspect-ratio: 16 / 9; max-width: 100%; border-radius: 14px; display: grid; place-items: center; text-decoration: none;
  background: radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--accent) 70%, var(--bg)), var(--surface) 70%); border: 1px solid var(--line); }
.play i { width: 76px; height: 76px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.play i::after { content: ""; width: 0; height: 0; border-left: 24px solid var(--bg); border-top: 15px solid transparent; border-bottom: 15px solid transparent; margin-left: 6px; }
.play:hover i { transform: scale(1.06); }
.seen { color: var(--good); font-weight: 700; }

/* swipe */
.swrap { max-width: 460px; margin: 0 auto; display: grid; gap: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 40px; }
.swinfo { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.stack { position: relative; height: min(58vh, 430px); min-height: 300px; }
.flash { position: absolute; inset: 0; background: var(--surface); border: 1.5px solid var(--line); border-radius: 22px; padding: 26px 22px;
  display: grid; grid-template-rows: auto 1fr auto; gap: 12px; touch-action: pan-y; user-select: none; cursor: grab;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45); transition: transform .22s ease, opacity .22s ease, border-color .2s; }
.flash.dragging { transition: none; cursor: grabbing; }
.flash.under { transform: scale(0.94) translateY(16px); opacity: 0.55; pointer-events: none; }
.flash.flipped { border-color: var(--accent); }
.face { align-self: center; text-align: center; text-wrap: balance; overflow-wrap: anywhere; }
.face.front { font-family: var(--display); font-weight: 600; font-size: clamp(1.3rem, 5vw, 1.7rem); line-height: 1.3; }
.face.back { font-size: 1.15rem; line-height: 1.5; }
.tap { text-align: center; color: var(--muted); font-size: 0.8rem; }
.stamp { position: absolute; top: 20px; font: 800 1rem var(--display); padding: 3px 12px; border: 2px solid; border-radius: 8px; opacity: 0; }
.stamp.yes { right: 20px; color: var(--good); transform: rotate(8deg); }
.stamp.no { left: 20px; color: var(--bad); transform: rotate(-8deg); }
.swctrl { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; }
.swctrl .no-btn { color: var(--bad); border-color: var(--bad); }
.swctrl .yes-btn { color: var(--good); border-color: var(--good); }

/* dagens */
.dash { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panel h2 { font-family: var(--display); font-weight: 800; font-size: 1.1rem; margin: 0; }
.plabel { font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
.bigstart { justify-self: start; font: 800 1.2rem var(--display); color: var(--bg); background: linear-gradient(120deg, var(--java), var(--math));
  border: none; border-radius: 999px; padding: 15px 30px; cursor: pointer; }
.bigstart:hover { filter: brightness(1.08); }
.donepill { color: var(--good); font-weight: 700; }
.streaknum { font-family: var(--display); font-weight: 800; font-size: 3.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal .h { font-size: 0.68rem; color: var(--muted); text-align: center; text-transform: uppercase; letter-spacing: 0.06em; }
.day { aspect-ratio: 1; max-width: 100%; border-radius: 8px; background: var(--code-bg); border: 1px solid var(--line); }
.day.done { background: linear-gradient(135deg, var(--java), var(--math)); border-color: transparent; }
.day.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.day.future { opacity: 0.25; }
.lvlrow { display: flex; align-items: baseline; gap: 10px; }
.lvl { font-family: var(--display); font-weight: 800; font-size: 2.6rem; line-height: 1; }
.shorts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.short { text-align: left; background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--ink); font: inherit; cursor: pointer; display: grid; gap: 2px; }
.short:hover { border-color: var(--math); }
.short b { font-size: 0.95rem; }
.short span { color: var(--muted); font-size: 0.8rem; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.badge { display: grid; gap: 3px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
.badge b { font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
.badge b::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
.badge.on { border-color: color-mix(in srgb, var(--math) 60%, var(--line)); }
.badge.on b::before { background: linear-gradient(135deg, var(--java), var(--math)); }
.badge span { color: var(--muted); font-size: 0.78rem; }
.badge.off { opacity: 0.5; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  background: var(--ink); color: var(--bg); font: 700 0.9rem var(--body); padding: 10px 18px; border-radius: 999px; box-shadow: 0 8px 24px rgba(0,0,0,.4); max-width: calc(100% - 32px); text-align: center; }

function traceSum() {
  const s = [{ l: 0, v: { sum: 0 }, n: 'sum starter på 0.' }];
  let sum = 0;
  for (let i = 0; i < 4; i++) {
    s.push({ l: 1, v: { sum, i }, n: 'i = ' + i + '. Er ' + i + ' < 4? Ja, inn i løkka.' });
    sum += i;
    s.push({ l: 2, v: { sum, i }, n: 'sum += ' + i + ' gir sum = ' + sum + '.' });
  }
  s.push({ l: 1, v: { sum, i: 4 }, n: 'i = 4. Er 4 < 4? Nei, løkka er ferdig.' });
  s.push({ l: 4, v: { sum }, o: String(sum), n: 'Skriver ut ' + sum + '.' });
  return s;
}
function traceHalve() {
  let n = 20, steg = 0;
  const s = [{ l: 0, v: { n }, n: 'n starter på 20.' }, { l: 1, v: { n, steg }, n: 'steg starter på 0.' }];
  while (n > 1) {
    s.push({ l: 2, v: { n, steg }, n: 'Er ' + n + ' > 1? Ja.' });
    n = Math.floor(n / 2);
    s.push({ l: 3, v: { n, steg }, n: 'n = n / 2 gir ' + n + ' (heltallsdivisjon kutter desimalene).' });
    steg++;
    s.push({ l: 4, v: { n, steg }, n: 'steg++ gir steg = ' + steg + '.' });
  }
  s.push({ l: 2, v: { n, steg }, n: 'Er 1 > 1? Nei, løkka er ferdig.' });
  s.push({ l: 6, v: { n, steg }, o: String(steg), n: 'Skriver ut ' + steg + '.' });
  return s;
}
function traceRev() {
  const str = 'kode'; let r = '';
  const q = x => '"' + x + '"';
  const s = [{ l: 0, v: { s: q(str) }, n: 's er "kode".' }, { l: 1, v: { s: q(str), r: q(r) }, n: 'r starter som en tom streng.' }];
  for (let i = str.length - 1; i >= 0; i--) {
    s.push({ l: 2, v: { r: q(r), i }, n: 'i = ' + i + '. Er ' + i + ' >= 0? Ja.' });
    r += str[i];
    s.push({ l: 3, v: { r: q(r), i }, n: "s.charAt(" + i + ") er '" + str[i] + "', så r blir " + q(r) + '.' });
  }
  s.push({ l: 2, v: { r: q(r), i: -1 }, n: 'i = -1. Er -1 >= 0? Nei, løkka er ferdig.' });
  s.push({ l: 5, v: { r: q(r) }, o: r, n: 'Skriver ut ' + r + '.' });
  return s;
}
function traceMax() {
  const t = [3, 8, 2, 9]; let maks = t[0];
  const s = [{ l: 0, v: { t: '{3, 8, 2, 9}' }, n: 'Tabellen har 4 tall.' }, { l: 1, v: { maks }, n: 'maks starter som t[0], altså 3.' }];
  for (let i = 1; i < t.length; i++) {
    s.push({ l: 2, v: { maks, i }, n: 'i = ' + i + '. Er ' + i + ' < 4? Ja.' });
    const big = t[i] > maks;
    s.push({ l: 3, v: { maks, i, 't[i]': t[i] }, n: 'Er t[' + i + '] = ' + t[i] + ' større enn ' + maks + '? ' + (big ? 'Ja.' : 'Nei, hopp over.') });
    if (big) { maks = t[i]; s.push({ l: 4, v: { maks, i, 't[i]': t[i] }, n: 'maks blir ' + maks + '.' }); }
  }
  s.push({ l: 2, v: { maks, i: 4 }, n: 'i = 4. Er 4 < 4? Nei, løkka er ferdig.' });
  s.push({ l: 7, v: { maks }, o: String(maks), n: 'Skriver ut ' + maks + '.' });
  return s;
}

// Sporinger
const fmtArr = a => '{' + a.join(', ') + '}';
const fmtMat = m => '{' + m.map(fmtArr).join(', ') + '}';
function traceReverser() {
  const t = [1, 2, 3], ny = [0, 0, 0];
  const s = [{ l: 0, v: { tabell: fmtArr(t) }, n: 'Tabellen har 3 tall.' },
    { l: 1, v: { tabell: fmtArr(t), ny: fmtArr(ny) }, n: 'new lager en ny tabell med plass til 3 tall. Den er fylt med 0.' }];
  for (let i = 0; i < 3; i++) {
    s.push({ l: 2, v: { ny: fmtArr(ny), i }, n: 'i = ' + i + '. Er ' + i + ' < 3? Ja.' });
    ny[i] = t[2 - i];
    s.push({ l: 3, v: { ny: fmtArr(ny), i }, n: 'ny[' + i + '] = tabell[' + (2 - i) + '] = ' + t[2 - i] + '. Indeksen 3 − 1 − ' + i + ' går baklengs.' });
  }
  s.push({ l: 2, v: { ny: fmtArr(ny), i: 3 }, n: 'i = 3. Er 3 < 3? Nei, løkka er ferdig.' });
  s.push({ l: 5, v: { ny: fmtArr(ny) }, o: '[3,2,1]', n: 'tilStreng gir "[3,2,1]". Den opprinnelige tabellen er uendret.' });
  return s;
}
function traceSortert() {
  return [
    { l: 0, v: { t: '{1, 4, 4, 7}' }, n: 'Vi sjekker om hvert tall er større enn tallet før.' },
    { l: 1, v: { i: 0 }, n: 'i = 0. Er 0 < 3 (t.length − 1)? Ja.' },
    { l: 2, v: { i: 0, 't[i]': 1, 't[i+1]': 4 }, n: 'Er 1 >= 4? Nei, gå videre.' },
    { l: 1, v: { i: 1 }, n: 'i = 1. Er 1 < 3? Ja.' },
    { l: 2, v: { i: 1, 't[i]': 4, 't[i+1]': 4 }, n: 'Er 4 >= 4? Ja! To like tall er ikke stigende.' },
    { l: 3, v: { i: 1 }, ret: 'false', n: 'Metoden returnerer false med en gang. Resten av tabellen sjekkes ikke.' }
  ];
}
function traceEuklid() {
  let x = 28, y = 12;
  const s = [{ l: 0, v: { x, y }, n: 'Metoden kalles med b(28, 12).' }];
  for (;;) {
    if (x === y) { s.push({ l: 1, v: { x, y }, n: 'Er ' + x + ' != ' + y + '? Nei, de er like. Løkka er ferdig.' }); break; }
    s.push({ l: 1, v: { x, y }, n: 'Er ' + x + ' != ' + y + '? Ja, inn i løkka.' });
    s.push({ l: 2, v: { x, y }, o: 'x = ' + x + ', y = ' + y, n: 'Skriver ut x og y.' });
    if (x > y) {
      s.push({ l: 3, v: { x, y }, n: 'Er ' + x + ' > ' + y + '? Ja.' });
      x = x - y;
      s.push({ l: 4, v: { x, y }, n: 'x = x − y gir x = ' + x + '.' });
    } else {
      s.push({ l: 3, v: { x, y }, n: 'Er ' + x + ' > ' + y + '? Nei, gå til else.' });
      y = y - x;
      s.push({ l: 6, v: { x, y }, n: 'y = y − x gir y = ' + y + '.' });
    }
  }
  s.push({ l: 9, v: { x, y }, ret: String(x), n: 'Returnerer ' + x + '. Det er største felles divisor av 28 og 12, akkurat som Euklids algoritme i MAT101.' });
  return s;
}

function traceSkaler() {
  const m = [[1, 2], [3, 4]], ny = [[0, 0], [0, 0]];
  const s = [{ l: 0, v: { m: fmtMat(m) }, n: 'En 2×2-matrise.' },
    { l: 1, v: { m: fmtMat(m), ny: fmtMat(ny) }, n: 'En ny matrise med samme størrelse, fylt med 0.' }];
  for (let i = 0; i < 2; i++) {
    s.push({ l: 2, v: { ny: fmtMat(ny), i }, n: 'i = ' + i + '. Vi jobber med rad ' + i + '.' });
    for (let j = 0; j < 2; j++) {
      s.push({ l: 3, v: { ny: fmtMat(ny), i, j }, n: 'j = ' + j + '. Er ' + j + ' < 2? Ja.' });
      ny[i][j] = m[i][j] * 3;
      s.push({ l: 4, v: { ny: fmtMat(ny), i, j }, n: 'ny[' + i + '][' + j + '] = ' + m[i][j] + ' · 3 = ' + ny[i][j] + '.' });
    }
    s.push({ l: 3, v: { ny: fmtMat(ny), i, j: 2 }, n: 'j = 2. Er 2 < 2? Nei, raden er ferdig.' });
  }
  s.push({ l: 2, v: { m: fmtMat(m), ny: fmtMat(ny) }, n: 'i = 2. Er 2 < 2? Nei. ny er ferdig, og m er uendret.' });
  return s;
}
function traceSiffer() {
  let hjelp = 7569, aS = 0;
  const s = [{ l: 0, v: { tall: 7569 }, n: 'tall er 7569.' }, { l: 1, v: { tall: 7569, hjelp }, n: 'hjelp er en kopi som vi kan endre.' }, { l: 2, v: { hjelp, aS }, n: 'aS starter på 0.' }];
  do {
    const f = hjelp; hjelp = Math.floor(hjelp / 10);
    s.push({ l: 4, v: { hjelp, aS }, n: f + ' / 10 = ' + hjelp + '. Heltallsdivisjon fjerner siste siffer.' });
    aS++;
    s.push({ l: 5, v: { hjelp, aS }, n: 'aS øker til ' + aS + '.' });
    s.push({ l: 6, v: { hjelp, aS }, n: 'Er ' + hjelp + ' > 0? ' + (hjelp > 0 ? 'Ja, en runde til.' : 'Nei, løkka er ferdig.') });
  } while (hjelp > 0);
  s.push({ l: 7, v: { aS }, o: '7569 har 4 siffer', n: 'Løkka teller hvor mange siffer tallet har.' });
  return s;
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function rich(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>'); }
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function btn(cls, label, fn) { const b = el('button', cls, label); b.type = 'button'; if (fn) b.addEventListener('click', fn); return b; }

function dateKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dayStreak() {
  const d = new Date();
  if (!state.days[dateKey(d)]) d.setDate(d.getDate() - 1);
  let n = 0;
  while (state.days[dateKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const LVL = 150;
function level() { return Math.floor(state.xp / LVL) + 1; }
function wrongIds() { return Object.keys(state.stats).filter(id => state.stats[id].last === false); }
function rightCount(pred) { return Q.filter(q => pred(q) && state.stats[q.id] && state.stats[q.id].r > 0).length; }

const toastQ = []; let toastTimer;

function nextToast() {
  const t = document.getElementById('toast');
  if (!toastQ.length) { t.hidden = true; return; }
  t.textContent = toastQ[0]; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastQ.shift(); nextToast(); }, 1700);
}

    if (!state.badges.includes(b.id) && b.test()) { state.badges.push(b.id); toast('Nytt merke: ' + b.name); }
  });
  save();
}
function addXP(n, quiet) {
  const before = level();
  state.xp += n;
  save();
  if (level() > before) toast('Nivå ' + level() + '! Godt jobba.');
  else if (!quiet) toast('+' + n + ' XP');
  checkBadges();
  updateHeader();
}
function scoreAnswer(ok) {
  state.streak = ok ? state.streak + 1 : 0;
  state.bestStreak = Math.max(state.bestStreak, state.streak);
}

function updateHeader() {
  document.getElementById('lvl').textContent = level();
  document.getElementById('xpfill').style.width = ((state.xp % LVL) / LVL * 100) + '%';
  document.getElementById('streak').textContent = state.streak;
  document.getElementById('tab-feil').textContent = 'Øv på feil (' + (wrongIds().length + Object.values(state.bugs).filter(x => x === false).length) + ')';
  document.getElementById('prog').style.width = round.length ? (answered / round.length * 100) + '%' : '0';
}

function meta(left, right) { return el('div', 'meta', '<span class="subj">' + esc(left) + '</span><span>' + esc(right) + '</span>'); }
function subjName(s) { return s === 'java' ? 'Java · DAT100' : 'Matte · MAT101'; }

function markDone(c, graded, ok) {
  if (c.dataset.done) return false;
  c.dataset.done = '1';
  answered++;
  if (graded && ok) roundRight++;
  if (fokus) { fokus.count++; if (graded && ok) fokus.right++; }
  const end = feed.querySelector('.end .big');
  if (end) end.textContent = roundRight + '/' + gradedCount();
  if (mode === 'dagens' && answered === round.length) completeDaily();
  updateHeader();
  return true;
}
function nextBtn(c) { return btn('btn', 'Neste ↓', () => goNext(c)); }
function goNext(c) {
  const n = c.nextElementSibling;
  if (n) n.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
}

function quizCard(q, n, total) {
  const c = el('section', 'card ' + q.s);
  const inner = el('div', 'inner');
  inner.appendChild(meta(subjName(q.s), (q.src ? q.src + ' · ' : '') + q.t + ' · ' + n + '/' + total));
  const h = el('h2', 'q'); h.textContent = q.q; inner.appendChild(h);
  if (q.c) { const p = el('pre'); p.textContent = q.c; inner.appendChild(p); }
  const opts = el('div', 'opts');
  shuffle(q.o.map((_, i) => i)).forEach((oi, pos) => {
    const b = btn('opt', '<span class="k">' + (pos + 1) + '</span><span class="t"></span>', () => answer(c, q, oi));
    b.id = 'opt-' + q.id + '-' + oi; b.dataset.i = oi;
    b.querySelector('.t').textContent = q.o[oi];
    opts.appendChild(b);
  });
  inner.appendChild(opts);
  const fb = el('div', 'fb'); fb.hidden = true; inner.appendChild(fb);
  if (n === 1) inner.appendChild(el('p', 'hint', 'Trykk på et svar, eller bruk tastene 1–4. Scroll for neste.'));
  c.appendChild(inner);

}
function answer(c, q, oi) {
  if (c.dataset.done) return;
  const ok = oi === q.a;
  c.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    const i = +b.dataset.i;
    b.classList.add(i === q.a ? 'right' : i === oi ? 'wrong' : 'dim');
  });
  const s = state.stats[q.id] || { r: 0, f: 0 };
  ok ? s.r++ : s.f++; s.last = ok; state.stats[q.id] = s;
  scoreAnswer(ok);
  markDone(c, true, ok);
  addXP(ok ? 10 : 2);
  const fb = c.querySelector('.fb');
  fb.innerHTML = '<p class="verdict ' + (ok ? 'ok">Riktig!' : 'no">Ikke helt. Riktig svar: ' + esc(q.o[q.a])) + '</p><p>' + rich(q.w) + '</p>';
  fb.appendChild(nextBtn(c));
  fb.hidden = false;
  const hint = c.querySelector('.hint'); if (hint) hint.remove();
}

function traceCard(tr, n, total) {
  const c = el('section', 'card ' + tr.s);
  const inner = el('div', 'inner');
  inner.appendChild(meta(tr.code ? 'Se koden kjøre' : 'Se det regnes ut', (tr.src ? tr.src + ' · ' : '') + tr.t + ' · ' + n + '/' + total));
  const h = el('h2', 'q'); h.textContent = tr.title; inner.appendChild(h);
  let viewEl, lineEls = [], rowEls = [];
  if (tr.code) {
    viewEl = el('div', 'code');
    tr.code.forEach((line, i) => {
      const d = el('div', 'ln', '<span class="no">' + (i + 1) + '</span><span class="lt"></span>');
      d.querySelector('.lt').textContent = line || ' ';
      viewEl.appendChild(d); lineEls.push(d);
    });
  } else {
    viewEl = el('div', 'tbl tt');
    const t = el('table'); const hr = el('tr');
    tr.table.head.forEach((x, ci) => { const th = el('th'); th.textContent = x; th.dataset.c = ci; hr.appendChild(th); });
    t.appendChild(hr);
    tr.table.rows.forEach(row => {
      const r = el('tr');
      row.forEach((x, ci) => { const td = el('td'); td.dataset.c = ci; td.dataset.v = x; r.appendChild(td); });
      t.appendChild(r); rowEls.push(r);
    });
    viewEl.appendChild(t);
  }
  inner.appendChild(viewEl);
  const vars = el('div', 'vars'), out = el('div', 'out'), note = el('p', 'note');
  if (tr.code) { inner.appendChild(vars); inner.appendChild(out); }
  inner.appendChild(note);
  const ctrl = el('div', 'ctrl');
  const prev = btn('ghost', '◀ Forrige'), play = btn('ghost', 'Spill av'), next = btn('ghost', 'Neste ▶'), count = el('span', 'count');
  ctrl.append(prev, play, next, count);
  inner.appendChild(ctrl);
  c.appendChild(inner);

  let i = 0, timer = null;
  const last = tr.steps.length - 1;
  function stop() { clearInterval(timer); timer = null; play.textContent = i === last ? 'Spill av på nytt' : 'Spill av'; }
  function render() {
    const st = tr.steps[i];
    if (tr.code) {
      lineEls.forEach((d, k) => d.classList.toggle('on', k === st.l));
      vars.innerHTML = Object.entries(st.v).map(([k, v]) => '<span class="var"><b>' + esc(k) + '</b> = ' + esc(v) + '</span>').join('');
      const prints = []; let ret = null;
      for (let k = 0; k <= i; k++) { if (tr.steps[k].o != null) prints.push(tr.steps[k].o); if (tr.steps[k].ret != null) ret = tr.steps[k].ret; }
      const hasRet = tr.steps.some(x => x.ret != null), parts = [];
      if (prints.length || !hasRet) parts.push('Utskrift: <b>' + (prints.length ? esc(prints.join('  ·  ')) : '–') + '</b>');
      if (hasRet) parts.push('Returnerer: <b>' + (ret != null ? esc(ret) : '–') + '</b>');
      out.innerHTML = parts.join(' &nbsp;&nbsp; ');
    } else {
      rowEls.forEach((r, ri) => {
        r.classList.toggle('on', ri === st.r && !st.hl);
        r.querySelectorAll('td').forEach(td => {
          const ci = +td.dataset.c, hidden = tr.table.hide.includes(ci) && ri > st.r;
          td.textContent = hidden ? '?' : td.dataset.v;
          td.classList.toggle('hid', hidden);
          td.classList.toggle('hl', !!(st.hl && st.hl.includes(ci)));
        });
      });
      viewEl.querySelectorAll('th').forEach(th => th.classList.toggle('hl', !!(st.hl && st.hl.includes(+th.dataset.c))));
    }
    note.textContent = st.n;
    count.textContent = (i + 1) + '/' + tr.steps.length;
    prev.disabled = i === 0; next.disabled = i === last;
    if (i === last) {
      stop();
      if (markDone(c, false, false) && !state.traces[tr.id]) { state.traces[tr.id] = true; addXP(5); }
      if (!c.querySelector('.ctrl .btn')) ctrl.appendChild(nextBtn(c));
    }
  }
  prev.addEventListener('click', () => { stop(); if (i > 0) { i--; render(); } });
  next.addEventListener('click', () => { stop(); if (i < last) { i++; render(); } });
  play.addEventListener('click', () => {
    if (timer) { stop(); return; }
    if (i === last) i = 0;
    render();
    play.textContent = 'Pause';
    timer = setInterval(() => { if (i < last) { i++; render(); } else stop(); }, reduce ? 1600 : 1200);
  });
  render();
  return c;
}

// ---------- RUNDER ----------
let io, topicArt = null;
function topicQs(a) { return Q.filter(q => q.s === a.s && a.topics.includes(q.t)); }
function byPriority(list, pri) { return shuffle(list).sort((a, b) => pri(a) - pri(b)); }
function buildRound(m, art) {
  const items = [];
  const add = (k, arr) => arr.forEach(d => items.push({ k, d }));
  if (art) {
    add('q', topicQs(art));
    add('trace', T.filter(t => t.s === art.s && art.topics.includes(t.t)));
    add('bug', B.filter(b => b.s === art.s && art.topics.includes(b.t)));
    add('video', V.filter(v => v.s === art.s && art.topics.includes(v.t)));
  } else if (m === 'feil') {
    const w = new Set(wrongIds());
    add('q', Q.filter(q => w.has(q.id)));
    add('bug', B.filter(b => state.bugs[b.id] === false));
  } else if (m === 'oblig') { add('q', Q.filter(x => x.src)); add('trace', T.filter(x => x.src)); add('bug', B.filter(x => x.src)); }
  else if (m === 'bugs') add('bug', B);
  else if (m === 'traces') add('trace', T);
  else if (m === 'dagens') {
    const w = new Set(wrongIds());
    add('q', byPriority(Q, q => w.has(q.id) ? 0 : !state.stats[q.id] ? 1 : 2).slice(0, 3));
    add('bug', byPriority(B, b => state.bugs[b.id] === false ? 0 : state.bugs[b.id] === undefined ? 1 : 2).slice(0, 1));
    add('trace', byPriority(T, t => state.traces[t.id] ? 1 : 0).slice(0, 1));
  } else {
    const f = x => m === 'alle' || x.s === m;
    add('q', Q.filter(f)); add('trace', T.filter(f)); add('bug', B.filter(f)); add('video', V.filter(f));
  }
  return shuffle(items);
}
const CHIP = { dagens: 'Dagens dose', bugs: 'Finn feilen', traces: 'Se koden kjøre', oblig: 'Fra obligene' };
function start(m, art) {
  mode = m; topicArt = art || null;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-pressed', String(!art && t.dataset.mode === m)));
  const chip = document.getElementById('topicChip');
  const label = art ? 'Tema: ' + art.short : CHIP[m];
  chip.hidden = !label;
  if (label) chip.textContent = label + ' ✕';
  round = buildRound(m, art); answered = 0; roundRight = 0;
  feed.innerHTML = '';
  if (!round.length) feed.appendChild(emptyCard());
  else {
    round.forEach((it, i) => {
      const f = { q: quizCard, trace: traceCard, bug: bugCard, video: videoCard }[it.k];
      feed.appendChild(f(it.d, i + 1, round.length));
    });
    feed.appendChild(endCard());
  }
  feed.scrollTop = 0;
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) current = e.target; }), { root: feed, threshold: 0.55 });
  feed.querySelectorAll('.card').forEach(c => io.observe(c));
  current = feed.firstElementChild;
  show('quiz');
  updateHeader();
}
function completeDaily() {
  const k = dateKey(new Date());
  if (state.days[k]) return;
  state.days[k] = true;
  save();
  addXP(25, true);
  toast('Dagens dose fullført! ' + dayStreak() + ' ' + (dayStreak() === 1 ? 'dag' : 'dager') + ' på rad.');
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {

}));
document.getElementById('topicChip').addEventListener('click', () => start('alle'));

let deck = [], sw = { known: 0 };
function startSwipe() {
  deck = byPriority(F, f => state.swipe[f.id] || 0).slice(0, 12);
  sw = { known: 0, total: deck.length };
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-pressed', String(t.dataset.mode === 'swipe')));
  document.getElementById('topicChip').hidden = true;
  renderSwipe();
}
function flashEl(f, under) {
  const d = el('div', 'flash ' + f.s + (under ? ' under' : ''));
  d.appendChild(el('span', 'kicker', f.s === 'java' ? 'Java' : 'Matte'));
  const front = el('div', 'face front', rich(f.f));
  const back = el('div', 'face back', rich(f.b)); back.hidden = true;
  d.append(front, back, el('span', 'tap', 'Trykk for å snu'), el('span', 'stamp yes', 'KAN'), el('span', 'stamp no', 'ØV MER'));
  return d;
}
function renderSwipe() {
  const root = document.getElementById('swipe');
  root.innerHTML = '';
  const w = el('div', 'swrap');
  if (!deck.length) {
    w.appendChild(el('h2', 'headline', 'Bunken er tom'));
    w.appendChild(el('p', 'ingress', 'Du kunne ' + sw.known + ' av ' + sw.total + ' kort. Kortene du ikke kunne, kommer oftere neste gang.'));
    w.appendChild(btn('bigstart', 'Ny bunke', startSwipe));
    root.appendChild(w);
    return;
  }
  w.appendChild(el('div', 'swinfo', '<span>Igjen: <b>' + deck.length + '</b></span><span>Kan: <b>' + sw.known + '</b></span><span>Sveip, eller bruk ← og →</span>'));
  const stack = el('div', 'stack');
  if (deck[1]) stack.appendChild(flashEl(deck[1], true));
  const card = flashEl(deck[0], false);
  stack.appendChild(card);
  w.appendChild(stack);
  const ctrl = el('div', 'swctrl');
  ctrl.append(btn('ghost no-btn', '← Øv mer', () => decide(false)), btn('ghost', 'Snu', flip), btn('ghost yes-btn', 'Kan →', () => decide(true)));
  w.appendChild(ctrl);
  root.appendChild(w);

  let x0 = null, dx = 0, busy = false;
  function flip() {
    const f = card.querySelector('.front'), b = card.querySelector('.back');
    const toBack = !f.hidden; f.hidden = toBack; b.hidden = !toBack;
    card.classList.toggle('flipped', toBack);
    card.querySelector('.tap').textContent = toBack ? 'Sveip: kunne du det?' : 'Trykk for å snu';
  }
  function decide(yes) {
    if (busy) return; busy = true;
    card.classList.remove('dragging');
    card.style.transform = 'translateX(' + (yes ? 130 : -130) + '%) rotate(' + (yes ? 18 : -18) + 'deg)';
    card.style.opacity = '0';
    setTimeout(() => {
      const f = deck.shift();
      state.swiped++;
      if (yes) { state.swipe[f.id] = Math.min((state.swipe[f.id] || 0) + 1, 3); sw.known++; addXP(2, true); }
      else { state.swipe[f.id] = 0; deck.splice(Math.min(3, deck.length), 0, f); save(); checkBadges(); }
      renderSwipe();
    }, reduce ? 0 : 200);
  }
  w.decide = decide; w.flip = flip;
  card.addEventListener('pointerdown', e => { x0 = e.clientX; dx = 0; card.setPointerCapture(e.pointerId); card.classList.add('dragging'); });
  card.addEventListener('pointermove', e => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 18) + 'deg)';
    card.querySelector('.stamp.yes').style.opacity = Math.max(0, Math.min(1, dx / 90));
    card.querySelector('.stamp.no').style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  const up = () => {
    if (x0 === null) return;
    x0 = null; card.classList.remove('dragging');
    if (Math.abs(dx) > 90) decide(dx > 0);
    else {
      card.style.transform = '';
      card.querySelectorAll('.stamp').forEach(s => { s.style.opacity = 0; });
      if (Math.abs(dx) < 6) flip();
    }
  };
  card.addEventListener('pointerup', up);
  card.addEventListener('pointercancel', up);
}

// ---------- FOKUSMODUS ----------
let fokus = null, focusTimer = null;
function startFocus() {
  fokus = { end: Date.now() + 10 * 60000, count: 0, right: 0 };
  document.body.classList.add('focus');
  if (!round.length || mode === 'dagens') start('alle'); else show('quiz');
  tickFocus();
  focusTimer = setInterval(tickFocus, 1000);
}
function tickFocus() {
  if (!fokus) return;
  const left = Math.max(0, fokus.end - Date.now());
  const s = Math.ceil(left / 1000);
  document.getElementById('focusTime').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  if (left <= 0) endFocus(true);
}
function endFocus(done) {
  clearInterval(focusTimer);
  document.body.classList.remove('focus');
  const f = fokus; fokus = null;
  if (done && f) {
    state.focusDone++; save();
    addXP(20, true);
    modal('Fokusøkta er ferdig', 'Du tok ' + f.count + ' kort og fikk ' + f.right + ' riktige på 10 minutter. Ta en pause nå, du har fortjent det.');
  }
}
document.getElementById('focusBtn').addEventListener('click', startFocus);
document.getElementById('focusStop').addEventListener('click', () => endFocus(false));

  const sp = el('section', 'panel');
  const n = dayStreak();
  sp.appendChild(el('span', 'plabel', 'Streak'));
  sp.appendChild(el('div', 'lvlrow', '<span class="streaknum amp">' + n + '</span><span class="ingress">' + (n === 1 ? 'dag' : 'dager') + ' på rad</span>'));
  const cal = el('div', 'cal');
  ['Ma', 'Ti', 'On', 'To', 'Fr', 'Lø', 'Sø'].forEach(d => cal.appendChild(el('span', 'h', d)));
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const startD = new Date(today); startD.setDate(today.getDate() - ((today.getDay() + 6) % 7) - 21);
  for (let k = 0; k < 28; k++) {
    const d = new Date(startD); d.setDate(startD.getDate() + k);
    const key = dateKey(d);
    const cls = 'day' + (state.days[key] ? ' done' : '') + (key === dateKey(today) ? ' today' : '') + (d > today ? ' future' : '');
    const cell = el('span', cls); cell.title = d.getDate() + '.' + (d.getMonth() + 1) + (state.days[key] ? ': øvd' : '');
    cal.appendChild(cell);
  }
  sp.appendChild(cal);
  dash.appendChild(sp);

  const lp = el('section', 'panel');
  lp.appendChild(el('span', 'plabel', 'Nivå'));
  lp.appendChild(el('div', 'lvlrow', '<span class="lvl">' + level() + '</span><span class="ingress">' + state.xp + ' XP totalt</span>'));
  const bar = el('span', 'xpbar', '<span style="width:' + ((state.xp % LVL) / LVL * 100) + '%"></span>');
  lp.appendChild(bar);
  lp.appendChild(el('p', 'ingress', (LVL - state.xp % LVL) + ' XP til nivå ' + (level() + 1) + '. Riktig svar gir 10 XP, en funnet feil gir 15, og dagens dose gir 25.'));
  lp.appendChild(el('span', 'plabel', 'Snarveier'));
  const sh = el('div', 'shorts');
  [['Se koden kjøre', 'Animert, steg for steg', () => start('traces')],
   ['Finn feilen', 'Trykk på linja som er feil', () => start('bugs')],
   ['Swipe-kort', 'Kan eller kan ikke?', () => { startSwipe(); show('swipe'); }],
   ['Fokus 10 min', 'Alt annet skjules', startFocus],
   ['Fra obligene', 'Innleveringer, JavEl og labber', () => start('oblig')],
   ['Les en artikkel', 'JavEl, matriser, relasjoner …', () => { renderFront(); show('read'); }]].forEach(([a, b, fn]) => {
    sh.appendChild(btn('short', '<b>' + a + '</b><span>' + b + '</span>', fn));
  });
  lp.appendChild(sh);
  dash.appendChild(lp);

  const bp = el('section', 'panel');
  bp.appendChild(el('span', 'plabel', 'Merker · ' + state.badges.length + ' av ' + BADGES.length));
  const bs = el('div', 'badges');
  BADGES.forEach(b => {
    const on = state.badges.includes(b.id);
    bs.appendChild(el('div', 'badge ' + (on ? 'on' : 'off'), '<b>' + esc(b.name) + '</b><span>' + esc(b.desc) + '</span>'));
  });
  bp.appendChild(bs);
  bp.style.gridColumn = '1 / -1';
  dash.appendChild(bp);

  w.appendChild(dash);
  todayEl.appendChild(w);
  todayEl.scrollTop = 0;
}

// ---------- LES ----------
function textOf(a) {
  let t = a.title + ' ' + a.ingress;
  a.body.forEach(b => { t += ' ' + (Array.isArray(b[1]) ? b[1].flat().join(' ') : b[1]); });
  return t;
}
function readTime(a) { return Math.max(2, Math.round(textOf(a).split(/\s+/).length / 170)); }
function visual(a, cls) { const v = el('div', 'visual' + (cls ? ' ' + cls : '')); v.textContent = a.hero; v.setAttribute('aria-hidden', 'true'); return v; }
function textBlock(a, tag, withIngress) {
  const t = el('div', 'txt');
  t.appendChild(el('span', 'kicker', esc(a.kicker)));
  const h = el(tag, 'headline'); h.textContent = a.title; t.appendChild(h);
  if (withIngress) { const p = el('p', 'ingress'); p.textContent = a.ingress; t.appendChild(p); }
  t.appendChild(el('span', 'rt', readTime(a) + ' min lesing · ' + topicQs(a).length + ' øveoppgaver'));
  return t;
}
function itemBtn(a) {
  const b = btn('item ' + a.s, '', () => openArticle(a)); b.id = 'item-' + a.id;
  b.appendChild(visual(a, 'sm'));
  b.appendChild(textBlock(a, 'h3', true));
  return b;
}
function renderFront() {
  readEl.innerHTML = '';
  const w = el('div', 'wrap');
  const mast = el('div', 'mast');
  mast.appendChild(el('h1', null, 'Forklart'));
  mast.appendChild(el('p', null, 'Korte artikler om pensum i DAT100 og MAT101. Les en artikkel, og øv på temaet rett etterpå.'));
  w.appendChild(mast);
  const leadA = A.find(a => a.id === 'javel') || A[0];
  const lead = btn('lead ' + leadA.s, '', () => openArticle(leadA)); lead.id = 'lead-' + leadA.id;
  lead.appendChild(visual(leadA));
  lead.appendChild(textBlock(leadA, 'h2', true));
  w.appendChild(lead);
  const cols = el('div', 'cols');
  [['java', 'DAT100 · Java'], ['math', 'MAT101 · Diskret matematikk']].forEach(([s, name]) => {
    const col = el('section', 'col');
    col.appendChild(el('h2', null, name));
    A.filter(a => a.s === s && a !== leadA).forEach(a => col.appendChild(itemBtn(a)));
    cols.appendChild(col);
  });
  w.appendChild(cols);
  readEl.appendChild(w);
  readEl.scrollTop = 0;
}
function block(b) {
  const [type, v] = b;
  if (type === 'p') return el('p', null, rich(v));
  if (type === 'h') { const h = el('h3'); h.textContent = v; return h; }
  if (type === 'code') { const p = el('pre'); p.textContent = v; return p; }
  if (type === 'ul' || type === 'ol') { const l = el(type); v.forEach(x => l.appendChild(el('li', null, rich(x)))); return l; }
  if (type === 'tip') { const d = el('div', 'tip'); d.appendChild(el('span', 'lbl', 'Eksamenstips')); d.appendChild(el('p', null, rich(v))); return d; }
  if (type === 'table') {
    const wrap = el('div', 'tbl'), t = el('table');
    v.forEach((row, i) => { const tr = el('tr'); row.forEach(cell => tr.appendChild(el(i === 0 ? 'th' : 'td', null, rich(cell)))); t.appendChild(tr); });
    wrap.appendChild(t);
    return wrap;
  }
  return el('div');
}
function openArticle(a) {
  readEl.innerHTML = '';
  const w = el('div', 'wrap');
  const art = el('article', 'article ' + a.s);
  art.appendChild(btn('back', '← Alle artikler', renderFront));
  art.appendChild(el('span', 'kicker', esc(a.kicker)));
  const h = el('h1', 'headline'); h.textContent = a.title; art.appendChild(h);
  const ing = el('p', 'ingress'); ing.textContent = a.ingress; art.appendChild(ing);
  art.appendChild(el('span', 'rt', 'Kaffe & Logikk · ' + readTime(a) + ' min lesing'));
  art.appendChild(visual(a));
  const body = el('div', 'body');
  a.body.forEach(b => body.appendChild(block(b)));
  art.appendChild(body);
  const n = buildRound('tema', a).length;
  const cta = el('div', 'cta');
  cta.appendChild(el('p', null, '<b>Test deg selv.</b> ' + n + ' kort om ' + esc(a.short.toLowerCase()) + ': oppgaver, animasjoner og videoer.'));
  cta.appendChild(btn('btn', 'Start øving', () => start('tema', a)));
  art.appendChild(cta);
  const more = el('section', 'more');
  more.appendChild(el('h2', null, 'Les også'));
  A.filter(x => x.s === a.s && x !== a).slice(0, 3).forEach(x => more.appendChild(itemBtn(x)));
  art.appendChild(more);
  w.appendChild(art);
  readEl.appendChild(w);
  readEl.scrollTop = 0;
}

// ---------- TASTATUR ----------
document.addEventListener('keydown', e => {
  if (!document.getElementById('modal').hidden) { if (e.key === 'Escape' || e.key === 'Enter') { document.getElementById('modal').hidden = true; e.preventDefault(); } return; }
  if (e.target.closest('input, textarea')) return;
  if (view === 'swipe') {
    const w = document.querySelector('#swipe .swrap');
    if (!w || !w.decide) return;
    if (e.key === 'ArrowRight') { w.decide(true); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { w.decide(false); e.preventDefault(); }
    else if (e.key === ' ') { w.flip(); e.preventDefault(); }
    return;
  }
  if (view !== 'quiz' || !current) return;
  const n = parseInt(e.key, 10);
  const opts = current.querySelectorAll('.opt, .bl');
  if (n >= 1 && n <= opts.length && !current.dataset.done) { opts[n - 1].click(); e.preventDefault(); }
  else if (e.key === 'Enter' && current.dataset.done) { goNext(current); e.preventDefault(); }
});

function countdownText() {
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const d = s => Math.round((new Date(s + 'T00:00:00') - now) / 86400000);
  const j = d('2026-11-24'), m = d('2026-12-04');
  const fmt = (n, navn) => n > 0 ? navn + ' om <b>' + n + '</b> dager' : n === 0 ? navn + ' <b>i dag</b>' : navn + ' er ferdig';
  return fmt(j, 'Java-eksamen') + ' · ' + fmt(m, 'matte-eksamen');
}

updateHeader();
checkBadges();
if (location.hash === '#les') { renderFront(); show('read'); }
else if (location.hash === '#ov') start('alle');
else show('today');
</script>
